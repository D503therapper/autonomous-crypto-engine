# The AI question box relay: the dashboard sends a question here, this adds the engine's data sheet
# (docs/sports/brain.json) and asks Claude. The API key lives only in Cloudflare (a Worker secret).
name = "d503-ask"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-opus-5-5"   # the owner's pick: newest Opus, best answers ("claude-haiku-4-5" is cheapest but makes mistakes)
EFFORT = "low"              # (Sonnet/Opus only) quick chat answers; "medium" thinks harder
