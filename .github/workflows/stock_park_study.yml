# Owner question from results/research_log.md ("Stocks: park idle cash in SPY between RSI2 trades"):
# rsi2 vs rsi2 + idle cash parked in SPY/QQQ vs more/bigger slots vs hold SPY/QQQ, 25 years of daily bars.
name: stock-park-study
on:
  push:
    branches: [main]
    paths: ["stock_park_study.py", ".github/workflows/stock_park_study.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: stock_park_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u stock_park_study.py --years 25 2>&1 | tee results/stock_park_study.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "stock-park-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push && break; sleep 10; done
