# Empirical study of DEX entry + exit rules on GeckoTerminal history (dex_exit_study.py); results committed to results/.
# results/dex_exit_pools.json is the pool registry: every run adds pools (incl. new ones that later rug) for the next run.
name: dex-exit-study
on:
  push:
    paths: ["dex_exit_study.py", ".github/workflows/dex_exit_study.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: dex_exit_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u dex_exit_study.py --budget-min 95 2>&1 | tee results/dex_exit_study.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "dex-exit-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
