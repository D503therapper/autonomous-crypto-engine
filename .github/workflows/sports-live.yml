# THE D503 SPORTS ENGINE - LIVE VALUE (paper picks only). If anything's live (or starts within 2 hours), watch every
# live game every second for ~45 minutes and publish live.json whenever the live board changes. The next watch
# queues right behind the running one, so there are no gaps during games. Rests right away when nothing's on.
# Started by this schedule, and by the hourly engine run as a backstop (GitHub's schedule skips runs).
name: sports-live
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write          # a watch queues the next one while games are on (the schedule alone can skip runs)
concurrency:
  group: sports-live
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git config merge.sportsjson.driver "python tools/merge_json.py %O %A %B"
          timeout 50m python -u sports_live.py --loop 45
