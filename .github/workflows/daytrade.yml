# Day-trading tournament on ~2 years of real hourly prices; results committed to results/.
name: daytrade-tournament
on:
  push:
    paths: ["daytrade.py", ".github/workflows/daytrade.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daytrade
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u daytrade.py --market crypto --days 720 2>&1 | grep -v "bars$" | tee results/daytrade_crypto.txt
          python -u daytrade.py --market stocks --days 720 2>&1 | tee results/daytrade_stocks.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "day-trading tournament results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
