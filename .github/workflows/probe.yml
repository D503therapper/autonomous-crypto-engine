# Probe public endpoints from the GitHub runner (tools/probe.py); results in results/probe.txt.
name: probe
on:
  push:
    paths: ["tools/probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p results && python -u tools/probe.py | tee results/probe.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "probe results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
