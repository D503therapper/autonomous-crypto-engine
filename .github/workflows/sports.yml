# THE D503 SPORTS ENGINE (paper picks only). Every hour: sync scores + odds from ESPN, grade picks,
# retrain on new results, post the daily board after 8am Pacific, rebuild docs/sports/index.html.
name: sports
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "2,12,32 15,16 * * *"    # 8am Pacific (summer 15:00 / winter 16:00 UTC): game day's main board + tennis slate go up on time
    - cron: "1 6,7 * * *"            # 11pm Pacific: today's graded board clears for the "picks drop 8 AM PT" note
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post today's board + tennis slate now instead of waiting for 8am Pacific"
        type: boolean
        default: false
  push:
    branches: [main]      # only main runs it (side branches never start a duplicate run)
    paths: [".github/workflows/sports.yml", "sports.py", "sports_data.py", "sports_model.py", "sports_dashboard.py"]
permissions:
  contents: write
  actions: write        # starts the live watcher if a game's on (or close) and no watch is running
concurrency:
  group: sports-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: live watcher backstop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/backstop.sh
      - run: python sports_test.py
      - run: timeout 30m python -u sports.py 2>&1 | tee -a data/sports/run.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}     # (the engine's key for the 🔔 alerts - never printed)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SPORTS_POST_NOW: ${{ github.event.inputs.post_now == 'true' && '1' || '' }}
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git config merge.sportsjson.driver "python tools/merge_json.py %O %A %B"
          git add data/sports docs/sports
          git commit -qm "sports $(date -u '+%F %H:%M') UTC" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
