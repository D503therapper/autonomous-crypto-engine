# One-off (10/1 data audit): refill college football 2024-25 (about 45% of the games were missing). tools/ncaaf_backfill.py
name: ncaaf_backfill
on:
  push:
    branches: [main]
    paths: ["tools/ncaaf_backfill.py", ".github/workflows/ncaaf_backfill.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ncaaf_backfill
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p results && timeout 35m python -u tools/ncaaf_backfill.py | tee results/ncaaf_backfill.txt
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add data/sports/games/ncaaf results/ncaaf_backfill.txt 2>/dev/null || true
          git commit -qm "ncaaf backfill $(date -u '+%F %H:%M') UTC" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; git rebase --abort 2>/dev/null; sleep 7; done
