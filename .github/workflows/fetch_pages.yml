# 📰 Read public pages on GitHub's servers (tools/fetch_pages.py): the URLs in results/pages/urls.txt (or the input) ->
# results/pages/*.txt. Used for the official injury / availability reports Claude's sandbox can't open.
name: fetch_pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by spaces (blank = results/pages/urls.txt)"
        type: string
        default: ""
  push:
    paths: ["results/pages/urls.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: timeout 12m python -u tools/fetch_pages.py $URLS   # (10/7: through env - a URL's '&' in the command line
        env:                                                     #  ran half of it in the background: exit 127)
          URLS: ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results/pages
          git commit -qm "pages $(date -u '+%F %H:%M') UTC" || exit 0
          git stash -q --include-untracked || true
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ -n "$ok" ] || { echo "push failed - this run's results never reached main"; exit 1; }   # (10/3 audit: a failed save showed green)
