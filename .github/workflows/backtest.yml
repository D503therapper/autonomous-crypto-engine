# Runs the backtest on real Crypto.com history whenever backtest_request.txt changes
# (or on demand) and commits the results to results/.
name: backtest
on:
  push:
    paths: ["backtest_request.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: backtest
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          mkdir -p results
          args=$(grep -v '^#' backtest_request.txt | head -1)
          echo "args: $args"
          pip install -q -r requirements.txt
          python backtest.py $args 2>&1 | tee results/backtest_latest.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "backtest results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
