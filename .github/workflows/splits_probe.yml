# Which public sites could back up Action Network for lines + who's-betting-who (tools/splits_probe.py). Run by hand.
name: splits_probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools, sparse-checkout-cone-mode: false }
      - run: timeout 3m python3 -u tools/splits_probe.py
