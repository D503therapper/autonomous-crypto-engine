# Sends one test notification to the live-bet channel (so new subscribers can see it works): the ntfy app, and then
# the dashboard's own 🔔 alerts (Web Push) through the Worker's /push with the ntfy message id. Runs when this file
# changes or by hand.
name: notify_test
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/notify_test.yml"]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: data/sports/ask_url.txt, sparse-checkout-cone-mode: false }
      - run: |
          id=""
          for i in 1 2 3 4 5; do
            if out=$(curl -sS -m 20 -H "Title: D503 Sports Engine 🔥" -H "Tags: rotating_light" \
              -d "If you see this, you're all set. You'll get a notification every time the algorithm triggers a live bet. Trust the algorithm. 🐻" \
              https://ntfy.sh/d503-live-7b1123); then
              echo "$out"; echo SENT
              id=$(printf '%s' "$out" | jq -r '.id // empty')
              break
            fi
            echo "try $i failed"; sleep 5
          done
          ask=$(tr -d '[:space:]' < data/sports/ask_url.txt 2>/dev/null || true)
          ask=${ask%/}
          if [ -z "$id" ] || [ -z "$ask" ]; then
            echo "::notice::no dashboard alert sent (ntfy id: '${id}', worker: '${ask}')"; exit 0
          fi
          # the dashboard's 🔔 alerts: the Worker checks this id is really on the topic, then rings every phone
          curl -sS -m 20 -X POST -H "Content-Type: application/json" -d "{\"ntfy_id\":\"$id\"}" "$ask/push"; echo
          echo "WEB PUSH SENT for $id"
