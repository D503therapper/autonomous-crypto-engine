# Deep robustness study of the "buy new listings" rule (listings_study.py); results committed to results/.
name: listings-study
on:
  push:
    paths: ["listings_study.py", ".github/workflows/listings_study.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: listings_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u listings_study.py --months 18 2>&1 | grep -v "loaded \|skip \|paths " | tee results/listings_study.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "listings-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
