# 🎾 Tennis closing odds history for the tennis edge study (tools/fetch_tennis_odds.py). Past seasons are fetched
# once; the current season is refreshed weekly.
name: tennis_odds
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/fetch_tennis_odds.py", "workers/tdata/**", ".github/workflows/tennis_odds.yml"]
permissions:
  contents: write
concurrency:
  group: tennis-odds
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q openpyxl xlrd
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: relay through Cloudflare (tennis-data.co.uk blocks GitHub's servers)
        working-directory: workers/tdata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4.142.0 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "TDATA_RELAY=$url" >> "$GITHUB_ENV"
          sleep 10
          curl -sS -o /dev/null -w "relay test: %{http_code}\n" -m 60 "$url/2024/2024.xlsx" || true
      - run: python -u tools/fetch_tennis_odds.py
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add data/sports/tennis/hist_odds.csv.gz
          git commit -qm "tennis odds history $(date -u '+%F %H:%M') UTC" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
