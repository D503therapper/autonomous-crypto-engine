# 🎾 Tennis closing odds history for the tennis edge study (tools/fetch_tennis_odds.py). Past seasons are fetched
# once; the current season is refreshed weekly. The site blocks servers, so season files uploaded by hand to
# data/sports/tennis/raw (2024.xlsx = ATP, 2024w.xlsx = WTA) are used first.
name: tennis_odds
on:
  schedule:
    - cron: "41 * * * *"      # hourly: fills in any season the archive was too slow to give last time (seconds once done)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/fetch_tennis_odds.py", "data/sports/tennis/raw/**", ".github/workflows/tennis_odds.yml"]
permissions:
  contents: write
  actions: write
concurrency:
  group: tennis-odds
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q openpyxl xlrd
      - id: fetch
        run: timeout 24m python -u tools/fetch_tennis_odds.py
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add data/sports/tennis/hist_odds.csv.gz
          git commit -qm "tennis odds history $(date -u '+%F %H:%M') UTC" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
      - if: always() && steps.fetch.outputs.missing != '0' && steps.fetch.outputs.got != '0' && steps.fetch.outputs.got != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tennis_odds.yml --ref "${GITHUB_REF_NAME}" && echo "made progress - running again"
