# REFS / UMPS: backfill who officiated every game (ESPN game summaries, gameInfo.officials) a chunk at a time into
# data/sports/officials.json, then rerun the context study (sports_context.py). Runs every 2 hours until the history
# is in, then just keeps it current. (ESPN blocks the Claude container; GitHub Actions can reach it.)
name: sports_refs
on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["sports_context.py", ".github/workflows/sports_refs.yml"]
permissions:
  contents: write
concurrency:
  group: sports-refs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: timeout 38m python -u sports_context.py refs-backfill 2>&1 | tee -a data/sports/refs_run.log
        env:
          REFS_BUDGET_S: "1700"
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add data/sports/officials.json data/sports/context.json data/sports/refs_run.log
          git commit -qm "officials backfill + context study $(date -u '+%F %H:%M') UTC" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
