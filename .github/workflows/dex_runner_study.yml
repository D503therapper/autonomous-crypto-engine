# DEX runner study (dex_runner_study.py): which early signs come before the meme coins that run 2x / 5x / 10x
# within 1-7 days, on thousands of GeckoTerminal pool histories; results committed to results/.
# results/dex_runner_pools.json is the pool registry: every run adds pools (with their FIRST sighting) so later
# runs also study pools that rugged since (survivorship bias falls with every run).
name: dex-runner-study
on:
  push:
    paths: ["dex_runner_study.py", ".github/workflows/dex_runner_study.yml"]
  workflow_dispatch:
    inputs:
      budget_min:
        description: "minutes to spend fetching pool histories"
        default: "290"
permissions:
  contents: write
concurrency: dex_runner_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u dex_runner_study.py --budget-min "${{ github.event.inputs.budget_min || '290' }}" 2>&1 | tee results/dex_runner_study.txt
      - if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "dex-runner-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push && break; sleep 10; done
