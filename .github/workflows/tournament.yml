# Strategy tournament on years of real daily prices; results committed to results/.
name: tournament
on:
  push:
    paths: ["tournament.py", ".github/workflows/tournament.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: tournament
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u tournament.py --market crypto --days 1500 2>&1 | tee results/tournament_crypto.txt
          python -u tournament.py --market stocks --days 1800 2>&1 | tee results/tournament_stocks.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "tournament results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
