# Early-mover / new-listing backtest across every Crypto.com coin; results committed to results/.
name: pump-hunter
on:
  push:
    paths: ["pumps.py", ".github/workflows/pumps.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: pumps
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u pumps.py --days 150 2>&1 | grep -v "loaded\|skip" | tee results/pumps.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "pump-hunter results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
