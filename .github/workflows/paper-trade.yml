# Always-on paper trading. Each run stays on ~5h50m: it checks open positions
# against live prices every second (stocks: 15s) and runs the full strategy cycle every hour,
# saving to GitHub each hour. The schedule fires every hour: a scheduled run never cancels the running engine,
# it waits in line and starts the moment the current run ends (GitHub drops some scheduled runs, and restarts
# after pushes shift the 6h cycle - a 6-hourly schedule left the engine off 03:12-05:18 on 2026-09-28).
name: paper-trade
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]      # only main runs the live engine (a push to a side branch once replaced it for 33 min)
    paths: [".github/workflows/paper-trade.yml", "requirements.txt", "run_live.py", "engine.py",
            "strategy.py", "markets.py", "config.py", "data_source.py", "indicators.py",
            "scanner.py", "signals.py", "social.py", "dex.py", "dashboard.py", "stock_strategies.py"]   # restart only when files the engine runs change
permissions:
  contents: write
  actions: write       # start-up step sees whether the previous run is finishing; the last step starts the next run
concurrency:
  group: paper-trade
  cancel-in-progress: ${{ github.event_name == 'push' }}   # a push (new engine version) replaces the running one; schedule / hand-off runs only queue
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GIT_AUTOPUSH: "1"
      NTFY_TOPIC: "ace-b7d72af08465"
    steps:
      - uses: actions/checkout@v4
      # A push cancels the running engine, but this checkout usually happens BEFORE the cancelled
      # run's final "end of run" commit lands. Starting from that stale data and syncing with
      # `pull --rebase -X theirs` (local wins) then silently undoes the cancelled run's last trades
      # (seen 2026-09-25 23:10 UTC). Wait for the other run to finish, then start from its data.
      - name: wait for the previous run's final commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 30); do
            n=$(gh run list --workflow paper-trade.yml --status in_progress --json databaseId \
                  --jq 'map(select(.databaseId != ${{ github.run_id }})) | length' 2>/dev/null || echo 0)
            [ "${n:-0}" = "0" ] && break
            sleep 10
          done
          sleep 30
          git pull -q --ff-only || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
      # errors go into run.log too; if the engine ever stops early (a crash), restart it after 30s
      - run: |
          end=$((SECONDS + 345 * 60))
          while [ $SECONDS -lt $((end - 120)) ]; do
            # append line by line (reopening the file): the hourly `git pull --rebase` replaces data/run.log on disk,
            # and `tee -a` kept writing to the deleted copy, so run.log stopped updating after the first hour
            python -u run_live.py --watch $(( (end - SECONDS) / 60 )) 2>&1 | python3 -u tools/append_log.py data/run.log
            [ $SECONDS -lt $((end - 120)) ] || break
            echo "[$(date -u '+%F %H:%M') UTC] ENGINE STOPPED EARLY - restarting in 30s" | tee -a data/run.log
            sleep 30
          done
      - if: always()
        run: |
          git add data SCOREBOARD.md LAB.md docs || true
          git commit -qm "paper-trade end of run $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
      # Hand-off: GitHub drops some scheduled runs (the engine sat idle 11:12-12:30+ UTC on 2026-09-28), so a run that
      # reaches its normal end starts its own successor. Not on cancel/failure (a push already started a new one).
      - if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh run list --workflow paper-trade.yml --json databaseId,status \
                --jq 'map(select(.databaseId != ${{ github.run_id }} and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending"))) | length' 2>/dev/null || echo 0)
          [ "${n:-0}" = "0" ] && gh workflow run paper-trade.yml --ref main || echo "a successor is already queued"
