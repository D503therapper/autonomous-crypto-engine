# Always-on paper trading. Each run stays on ~5h50m: it checks open positions
# against live prices every second (stocks: 15s) and runs the full strategy cycle every hour,
# saving to GitHub each hour. A new run starts every 6 hours to keep it going 24/7.
name: paper-trade
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/paper-trade.yml", "requirements.txt", "run_live.py", "engine.py",
            "strategy.py", "markets.py", "config.py", "data_source.py", "indicators.py",
            "scanner.py", "signals.py", "social.py", "dex.py", "dashboard.py", "stock_strategies.py"]   # restart only when files the engine runs change
permissions:
  contents: write
  actions: read        # lets the start-up step see whether the previous run is still finishing
concurrency:
  group: paper-trade
  cancel-in-progress: true   # a new version of the engine replaces the running one
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GIT_AUTOPUSH: "1"
      NTFY_TOPIC: "ace-b7d72af08465"
    steps:
      - uses: actions/checkout@v4
      # A push cancels the running engine, but this checkout usually happens BEFORE the cancelled
      # run's final "end of run" commit lands. Starting from that stale data and syncing with
      # `pull --rebase -X theirs` (local wins) then silently undoes the cancelled run's last trades
      # (seen 2026-09-25 23:10 UTC). Wait for the other run to finish, then start from its data.
      - name: wait for the previous run's final commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 30); do
            n=$(gh run list --workflow paper-trade.yml --status in_progress --json databaseId \
                  --jq 'map(select(.databaseId != ${{ github.run_id }})) | length' 2>/dev/null || echo 0)
            [ "${n:-0}" = "0" ] && break
            sleep 10
          done
          sleep 30
          git pull -q --ff-only || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
      - run: python -u run_live.py --watch 345 | tee -a data/run.log
      - if: always()
        run: |
          git add data SCOREBOARD.md LAB.md docs || true
          git commit -qm "paper-trade end of run $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
