# Always-on paper trading. Each run stays on ~5h50m: it checks open positions
# against live prices every minute and runs the full strategy cycle every hour,
# saving to GitHub each hour. A new run starts every 6 hours to keep it going 24/7.
name: paper-trade
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: paper-trade
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GIT_AUTOPUSH: "1"
      NTFY_TOPIC: "ace-b7d72af08465"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
      - run: python -u run_live.py --watch 345 | tee -a data/run.log
      - if: always()
        run: |
          git add data SCOREBOARD.md || true
          git commit -qm "paper-trade end of run $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && break; sleep 5; done
