# Probe public endpoints from the GitHub runner (tools/probe_sports.py); results in results/probe_sports.txt.
name: probe_sports
on:
  push:
    paths: ["tools/probe_sports.py", ".github/workflows/probe_sports.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p results && python -u tools/probe_sports.py | tee results/probe_sports.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "probe_sports results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
