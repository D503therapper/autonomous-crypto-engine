# Owner 10-14 "$1k to $10k in a few months, maybe stocks": concentrated momentum / leveraged ETF / breakout / gap strategies, how often they 10x and how often they wipe out (moonshot_study.py)
name: moonshot-study
on:
  push:
    branches: [main]
    paths: ["moonshot_study.py", ".github/workflows/moonshot_study.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: moonshot_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u moonshot_study.py --years 16 2>&1 | tee results/moonshot_study.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "moonshot-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push && break; sleep 10; done
