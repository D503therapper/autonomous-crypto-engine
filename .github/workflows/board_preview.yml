# 👀 A dry run of a day's board at the current prices (tools/board_preview.py) - nothing posted, nothing saved but
# results/board_preview.txt. Run it by hand: Actions -> board_preview -> Run (day = YYYY-MM-DD, blank = tomorrow PT).
name: board_preview
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day to preview (YYYY-MM-DD, blank = tomorrow Pacific)"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: timeout 25m python -u tools/board_preview.py ${{ github.event.inputs.day }}
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results/board_preview.txt data/sports/lean_sides.json 2>/dev/null || git add results/board_preview.txt   # (10/5: the lean sides it named stay put)
          git commit -qm "board preview $(date -u '+%F %H:%M') UTC" || exit 0
          git stash -q --include-untracked || true   # (10/2: files the run touched blocked the pull - only the report ships)
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ -n "$ok" ] || { echo "push failed - this run's results never reached main"; exit 1; }   # (10/3 audit: a failed save showed green)
