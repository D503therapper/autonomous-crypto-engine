# Owner thesis "coins go up one day, drop the next, then bounce": short-hold (1-72h) swing strategies on
# liquid Crypto.com USD pairs, walk-forward, at 0.5%/side and 0.2%/side (crypto_swing_study.py); results committed to results/.
name: crypto-swing-study
on:
  push:
    paths: ["crypto_swing_study.py", ".github/workflows/crypto_swing_study.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: crypto_swing_study
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p results
          python -u crypto_swing_study.py --months 18 --workers 6 2>&1 \
            | grep -v "^  loaded \|^  skip " | tee results/crypto_swing_study.txt
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results
          git commit -m "crypto-swing-study results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push && break; sleep 10; done
